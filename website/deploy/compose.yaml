name: codex-channel-bridge-docs

services:
  docs:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    user: "101:101"
    restart: unless-stopped
    ports:
      - "${DOCS_LISTEN_ADDRESS:?set DOCS_LISTEN_ADDRESS}:${DOCS_PORT:-8092}:8080"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/docs/next/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
