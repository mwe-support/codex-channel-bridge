schemaVersion: 1

supervisor:
  drainTimeoutMs: 300000
  childExitTimeoutMs: 10000
  codexRestartCooldownMs: 30000
  diskSafetyFloorBytes: 536870912

profiles:
  example-primary:
    enabled: true
    workspace: /srv/codex-channel-bridge/example-primary/workspace
    codexHome: /srv/codex-channel-bridge/example-primary/codex-home
    stateDirectory: /srv/codex-channel-bridge/example-primary/state
    secretsFile: /srv/codex-channel-bridge/example-primary/state/secrets.env
    admission:
      mode: steer
      maximumActiveTurns: 1
      queueCapacity: 16
      maximumQueueAgeMs: 300000
      accountRateLimit: 30
      accountRateWindowMs: 60000
    approval:
      timeoutMs: 300000
      detail: minimal
    media:
      perAttachmentLimitBytes: 67108864
      profileQuotaBytes: 10737418240
    channelAccounts:
      qq-primary:
        provider: qq
        epochId: initial
        appId: env:QQ_BOT_APP_ID
        appSecret: env:QQ_BOT_APP_SECRET
        groupThreadScope: conversation
        accessPolicy:
          privateChats:
            mode: allowlist
            allow:
              - provider-private-identity
          groupChats:
            mode: allowlist
            allow:
              - provider-group-conversation-id
          groupParticipants:
            mode: allowlist
            allow:
              - provider-group-participant-id
      wa-primary:
        provider: whatsapp
        enabled: false
        epochId: initial
        groupThreadScope: conversation
        accessPolicy:
          privateChats:
            mode: deny
          groupChats:
            mode: deny
          groupParticipants:
            mode: deny

  example-secondary:
    enabled: false
    workspace: /srv/codex-channel-bridge/example-secondary/workspace
    codexHome: /srv/codex-channel-bridge/example-secondary/codex-home
    stateDirectory: /srv/codex-channel-bridge/example-secondary/state
